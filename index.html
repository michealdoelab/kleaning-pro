<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kleaning Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #F4F7F2;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #4CAF2A;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .hero h1 {
      margin-bottom: 10px;
      color: #2E7D32;
    }

    .hero p {
      margin-bottom: 30px;
      color: #555;
    }

    .buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 15px 30px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4CAF2A;
      color: white;
      transition: 0.3s;
      min-width: 150px;
    }

    .btn:hover {
      background: #2E7D32;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #eee;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  Kleaning Pro
</header>

<div class="hero">
  <h1>Welcome to Kleaning Pro</h1>
  <p>Professional Cleaning Services Management System</p>

  <div class="buttons">
    <button class="btn" onclick="goTo('admin.html')">Admin</button>
    <button class="btn" onclick="goTo('customer.html')">Customer</button>
    <button class="btn" onclick="goTo('cleaner.html')">Cleaner</button>
  </div>
</div>

<footer>
  © 2026 Kleaning Pro. All rights reserved.
</footer>

<script>
  function goTo(page) {
    window.location.href = page;
  }
</script>

</body>
</html>
